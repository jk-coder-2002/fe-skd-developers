<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#161B20" />

    <title>SKD Developers — Residential &amp; industrial construction in Surat</title>
    <meta
      name="description"
      content="SKD Developers builds homes, factory sheds and commercial projects across Surat and South Gujarat. Own supervisors on every site, honest quotes, handover on the promised date."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Fonts. Loaded with <link> rather than a CSS @import so they do not sit
         behind a render-blocking request chain. Same families, same weights. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Gujarati:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graph: without this, WhatsApp shows a blank grey box when the link
         is shared, which is how most local customers will receive it. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SKD Developers — Surat" />
    <meta
      property="og:description"
      content="Residential and industrial construction run by our own supervisors. Free site visit, same-day reply."
    />
    <meta property="og:image" content="/images/work/g5.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
